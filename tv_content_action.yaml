blueprint:
  name: "ТВ: действие на выбранном канале по программе или времени"
  description: >-
    Выполняет выбранные команды, если телевизор показывает заданный канал,
    а отдельная сущность сообщает о нужной передаче и/или текущее время входит
    в заданный интервал. Перед выполнением канал должен оставаться неизменным
    указанное число секунд — это защищает от ложных срабатываний при
    перелистывании каналов.

    Пример для Apple TV: сущность media_player.apple_tv, атрибут media_title,
    название канала «Телекомпания НТВ». В действиях можно отправить команды
    home, menu, select и другие команды remote.send_command.
  domain: automation
  homeassistant:
    min_version: 2024.6.0

  input:
    tv_section:
      name: "Телевизор и канал"
      icon: mdi:television
      input:
        tv_power_entity:
          name: "Сущность состояния телевизора"
          description: >-
            Media player или remote, по которому видно, что устройство включено.
            Для Apple TV обычно выбирается его media_player.
          selector:
            entity:
              multiple: false

        content_entity:
          name: "Сущность с текущим каналом"
          description: >-
            Например media_player Apple TV, у которого в media_title указано
            «Телекомпания НТВ».
          selector:
            entity:
              multiple: false

        content_attribute:
          name: "Атрибут с названием канала"
          description: >-
            Для Apple TV обычно media_title. Оставьте пустым, чтобы проверять
            основное состояние сущности.
          default: media_title
          selector:
            text:

        target_names:
          name: "Названия каналов"
          description: >-
            Одно или несколько названий, например «Телекомпания НТВ».
          selector:
            text:
              multiple: true

        match_mode:
          name: "Сравнение названия канала"
          default: contains
          selector:
            select:
              mode: dropdown
              options:
                - label: "Содержит текст"
                  value: contains
                - label: "Полностью совпадает"
                  value: exact

        channel_hold_seconds:
          name: "Сколько секунд канал должен оставаться выбранным"
          description: >-
            Если во время задержки канал изменится, отсчёт будет отменён.
            Это предотвращает срабатывание при быстром перелистывании каналов.
          default: 10
          selector:
            number:
              min: 0
              max: 300
              step: 1
              unit_of_measurement: s
              mode: box

    activation_section:
      name: "Когда разрешено срабатывание"
      icon: mdi:calendar-clock
      input:
        activation_mode:
          name: "Условие запуска"
          default: program_or_time
          selector:
            select:
              mode: dropdown
              options:
                - label: "Нужная программа ИЛИ заданное время"
                  value: program_or_time
                - label: "Только нужная программа"
                  value: program
                - label: "Только заданное время"
                  value: time
                - label: "Нужная программа И заданное время"
                  value: program_and_time

        program_entity:
          name: "Отдельная сущность телепрограммы (необязательно)"
          description: >-
            Сенсор с названием текущей передачи. Для режима «только время»
            можно оставить пустым.
          default: ""
          selector:
            entity:
              multiple: false

        program_attribute:
          name: "Атрибут с названием передачи (необязательно)"
          description: >-
            Оставьте пустым, если название передачи является состоянием сенсора.
          default: ""
          selector:
            text:

        program_names:
          name: "Названия передач"
          description: >-
            Одно или несколько названий. Для режима «только время» список
            можно оставить пустым.
          default: []
          selector:
            text:
              multiple: true

        program_match_mode:
          name: "Сравнение названия передачи"
          default: contains
          selector:
            select:
              mode: dropdown
              options:
                - label: "Содержит текст"
                  value: contains
                - label: "Полностью совпадает"
                  value: exact

        use_time_window:
          name: "Использовать временной интервал"
          description: >-
            Включите для режимов, в которых участвует время.
          default: true
          selector:
            boolean:

        start_time:
          name: "Начало интервала"
          default: "18:00:00"
          selector:
            time:

        end_time:
          name: "Конец интервала"
          description: "Поддерживается интервал через полночь, например 23:00–01:00."
          default: "23:59:59"
          selector:
            time:

        cooldown_minutes:
          name: "Не повторять действие, минут"
          description: >-
            Защищает от повторного выполнения при обновлении сущностей.
          default: 5
          selector:
            number:
              min: 0
              max: 1440
              step: 1
              unit_of_measurement: min
              mode: box

    action_section:
      name: "Команды"
      icon: mdi:remote-tv
      input:
        action_to_run:
          name: "Что выполнить"
          description: >-
            Добавьте одну или несколько команд. Для Apple TV, например:
            remote.send_command с командами home, menu или select.
          selector:
            action:

mode: restart
max_exceeded: silent

variables:
  tv_power_entity: !input tv_power_entity
  content_entity: !input content_entity
  content_attribute: !input content_attribute
  target_names: !input target_names
  match_mode: !input match_mode
  activation_mode: !input activation_mode
  program_entity: !input program_entity
  program_attribute: !input program_attribute
  program_names: !input program_names
  program_match_mode: !input program_match_mode
  use_time_window: !input use_time_window
  start_time: !input start_time
  end_time: !input end_time
  cooldown_minutes: !input cooldown_minutes

trigger_variables:
  watched_program_entity: !input program_entity
  watched_program_attribute: !input program_attribute
  watched_program_names: !input program_names
  watched_program_match_mode: !input program_match_mode

trigger:
  - platform: state
    entity_id: !input content_entity
    attribute: !input content_attribute
    id: channel_changed

  - platform: state
    entity_id: !input tv_power_entity
    id: tv_changed

  - platform: template
    id: program_started
    value_template: >-
      {% if watched_program_entity | string | length == 0 %}
        false
      {% else %}
        {% set raw = state_attr(watched_program_entity, watched_program_attribute)
           if watched_program_attribute | string | length > 0
           else states(watched_program_entity) %}
        {% set current = raw | default('', true) | string | trim | lower %}
        {% set ns = namespace(found=false) %}
        {% for item in watched_program_names %}
          {% set wanted = item | string | trim | lower %}
          {% if wanted | length > 0 and
                ((watched_program_match_mode == 'exact' and current == wanted) or
                 (watched_program_match_mode == 'contains' and wanted in current)) %}
            {% set ns.found = true %}
          {% endif %}
        {% endfor %}
        {{ ns.found }}
      {% endif %}

  - platform: time
    at: !input start_time
    id: window_started

  - platform: homeassistant
    event: start
    id: home_assistant_started

condition:
  - condition: template
    alias: "Телевизор включён"
    value_template: >-
      {{ states(tv_power_entity) | lower
         not in ['off', 'unavailable', 'unknown', 'standby', 'none'] }}

  - condition: template
    alias: "Сейчас выбран нужный канал"
    value_template: >-
      {% set raw = state_attr(content_entity, content_attribute)
         if content_attribute | length > 0 else states(content_entity) %}
      {% set current = raw | default('', true) | string | trim | lower %}
      {% set ns = namespace(found=false) %}
      {% for item in target_names %}
        {% set wanted = item | string | trim | lower %}
        {% if wanted | length > 0 and
              ((match_mode == 'exact' and current == wanted) or
               (match_mode == 'contains' and wanted in current)) %}
          {% set ns.found = true %}
        {% endif %}
      {% endfor %}
      {{ ns.found }}

  - condition: template
    alias: "Совпала программа и/или время"
    value_template: >-
      {% set raw_program = state_attr(program_entity, program_attribute)
         if program_entity | length > 0 and program_attribute | length > 0
         else states(program_entity) if program_entity | length > 0 else '' %}
      {% set current_program = raw_program | default('', true) | string | trim | lower %}
      {% set ns = namespace(program_ok=false) %}
      {% for item in program_names %}
        {% set wanted = item | string | trim | lower %}
        {% if wanted | length > 0 and
              ((program_match_mode == 'exact' and current_program == wanted) or
               (program_match_mode == 'contains' and wanted in current_program)) %}
          {% set ns.program_ok = true %}
        {% endif %}
      {% endfor %}

      {% set current_time = now().strftime('%H:%M:%S') %}
      {% set start = (start_time | string)[:8] %}
      {% set end = (end_time | string)[:8] %}
      {% set time_ok = use_time_window and
           ((start <= end and start <= current_time < end) or
            (start > end and (current_time >= start or current_time < end))) %}

      {{ (activation_mode == 'program' and ns.program_ok)
         or (activation_mode == 'time' and time_ok)
         or (activation_mode == 'program_or_time' and (ns.program_ok or time_ok))
         or (activation_mode == 'program_and_time' and ns.program_ok and time_ok) }}

  - condition: template
    alias: "Истёк интервал защиты от повторов"
    value_template: >-
      {% set last = this.attributes.last_triggered %}
      {{ last is none or cooldown_minutes | int(0) == 0 or
         (as_timestamp(now()) - as_timestamp(last)) >=
         cooldown_minutes | int(0) * 60 }}

action:
  - alias: "Ждать, пока канал остаётся выбранным"
    delay:
      seconds: !input channel_hold_seconds

  - condition: template
    alias: "После задержки телевизор всё ещё включён"
    value_template: >-
      {{ states(tv_power_entity) | lower
         not in ['off', 'unavailable', 'unknown', 'standby', 'none'] }}

  - condition: template
    alias: "После задержки канал не изменился"
    value_template: >-
      {% set raw = state_attr(content_entity, content_attribute)
         if content_attribute | length > 0 else states(content_entity) %}
      {% set current = raw | default('', true) | string | trim | lower %}
      {% set ns = namespace(found=false) %}
      {% for item in target_names %}
        {% set wanted = item | string | trim | lower %}
        {% if wanted | length > 0 and
              ((match_mode == 'exact' and current == wanted) or
               (match_mode == 'contains' and wanted in current)) %}
          {% set ns.found = true %}
        {% endif %}
      {% endfor %}
      {{ ns.found }}

  - condition: template
    alias: "После задержки программа и/или время всё ещё подходят"
    value_template: >-
      {% set raw_program = state_attr(program_entity, program_attribute)
         if program_entity | length > 0 and program_attribute | length > 0
         else states(program_entity) if program_entity | length > 0 else '' %}
      {% set current_program = raw_program | default('', true) | string | trim | lower %}
      {% set ns = namespace(program_ok=false) %}
      {% for item in program_names %}
        {% set wanted = item | string | trim | lower %}
        {% if wanted | length > 0 and
              ((program_match_mode == 'exact' and current_program == wanted) or
               (program_match_mode == 'contains' and wanted in current_program)) %}
          {% set ns.program_ok = true %}
        {% endif %}
      {% endfor %}

      {% set current_time = now().strftime('%H:%M:%S') %}
      {% set start = (start_time | string)[:8] %}
      {% set end = (end_time | string)[:8] %}
      {% set time_ok = use_time_window and
           ((start <= end and start <= current_time < end) or
            (start > end and (current_time >= start or current_time < end))) %}

      {{ (activation_mode == 'program' and ns.program_ok)
         or (activation_mode == 'time' and time_ok)
         or (activation_mode == 'program_or_time' and (ns.program_ok or time_ok))
         or (activation_mode == 'program_and_time' and ns.program_ok and time_ok) }}

  - alias: "Выполнить выбранные команды"
    choose:
      - conditions: []
        sequence: !input action_to_run
